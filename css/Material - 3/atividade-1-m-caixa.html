<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Atividade 1 - Modelo de Caixa</title>

    <style>
        .caixa {
            padding: 15px;
            border: 3px solid red;
            margin: 25px;
            background-color: yellow;
        }

        body {
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <h1>Testando o Box Model</h1>

    <div class="caixa">
        <h2>Entendendo o CSS</h2>
        <p>O texto aqui dentro não encosta na borda vermelha por causa do padding de 15px.</p>
    </div>

    <p>Este parágrafo do lado de fora é empurrado para longe por causa da margin de 25px.</p>

</body>

</html>
