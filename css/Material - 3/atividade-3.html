<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Atividade 3</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .caixa {
            width: 300px;
            padding: 15px;
            margin: 10px;
            background-color: #f0f0f0;
        }

        .caixa1 {
            border: 3px solid red;
        }

        .caixa2 {
            border: 3px solid blue;
        }

        .caixa3 {
            border: 3px solid green;
        }
    </style>
</head>

<body>
    <!-- exemplos -->
    <div class="caixa caixa1">
        <p>O HTML é a linguagem que usamos para montar a estrutura básica da nossa página web.</p>
    </div>

    <div class="caixa caixa2">
        <p>O CSS é o que usamos para estilizar os elementos, mudando cores, fontes e espaçamentos.</p>
    </div>

    <div class="caixa caixa3">
        <p>A propriedade border-box é muito útil para manter o tamanho exato dos elementos na tela.</p>
    </div>

</body>

</html>
