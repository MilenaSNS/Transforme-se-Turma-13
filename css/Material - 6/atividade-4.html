<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4 - Transições e Animações</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 50px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            margin-top: 50px;
        }

        .btn-jogar {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;

            transition: background-color 0.4s ease;
        }

        .btn-jogar:hover {
            background-color: #2c3e50;
        }

        .selo-novo {
            background-color: #e74c3c;
            color: white;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            margin: 0 auto;


            animation: pulsar 1s infinite ease-in-out;
        }


        @keyframes pulsar {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <h2>A - Botão com Transição Suave</h2>
    <button class="btn-jogar">▶ Jogar Agora</button>

    <h2>B - Animação de Pulsar (Infinito)</h2>
    <div class="selo-novo">NOVO!</div>

</body>

</html>
