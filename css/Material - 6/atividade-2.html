<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Atividade 2 - Grid Template Areas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            display: grid;
            grid-template-columns: 200px 1fr;

            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";

            min-height: 400px;
            gap: 10px;

            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            grid-area: header;
            background-color: #3498db;
            /* Azul */
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #2ecc71;
            /* Verde */
            color: white;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .main {
            grid-area: main;
            background-color: #9b59b6;
            /* Roxo */
            color: white;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            grid-area: footer;
            background-color: #f39c12;
            /* Laranja */
            color: white;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">HEADER</div>
        <div class="sidebar">SIDEBAR</div>
        <div class="main">MAIN (Conteúdo Principal)</div>
        <div class="footer">FOOTER</div>
    </div>

</body>

</html>
