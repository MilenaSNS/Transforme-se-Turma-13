<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1 - CSS Grid Emojis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .caixa-emoji {
            background-color: #51ac59;
            font-size: 50px;
            text-align: center;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <h2>Grid de Emojis Geek</h2>

    <div class="container">

        <div class="caixa-emoji">🎮</div>
        <div class="caixa-emoji">👾</div>
        <div class="caixa-emoji">👽</div>

        <div class="caixa-emoji">🧙‍♂️</div>
        <div class="caixa-emoji">👻</div>
        <div class="caixa-emoji">⭐</div>
    </div>

</body>

</html>
