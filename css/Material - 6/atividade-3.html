<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3 - Galeria Responsiva</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            margin: 0;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }


        .galeria {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }


        @media (min-width: 600px) {
            .galeria {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 900px) {
            .galeria {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .card p {
            padding: 15px;
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>

<body>

    <h2>Galeria Geek Responsiva</h2>

    <div class="galeria">

        <div class="card">
            <img src="imgs/the-sims-4.jpg" alt="The Sims 4">
            <p>The Sims 4</p>
        </div>

        <div class="card">
            <img src="imgs/The-Witcher-III.jpg" alt="The Witcher 3">
            <p>The Witcher 3</p>
        </div>

        <div class="card">
            <img src="imgs/Far-Cry-5.jpg" alt="Far Cry 5">
            <p>Far Cry 5</p>
        </div>

        <div class="card">
            <img src="imgs/Tbby.jpg" alt="The Big Bang Theory">
            <p>The Big Bang Theory</p>
        </div>

        <div class="card">
            <img src="imgs/eu-a-patroa-e-as-criancas.jpg" alt="Eu, a Patroa e as Crianças">
            <p>Eu, a Patroa e as Crianças</p>
        </div>

        <div class="card">
            <img src="imgs/kenan-e-kel.jpg" alt="Kenan e Kel">
            <p>Kenan & Kel</p>
        </div>

    </div>

</body>

</html>
