<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Atividade 2 - Pseudo-classes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #eaeaea;
        }

        /* Uma caixa para organizar tudo como se fosse um painel lateral */
        .painel {
            background-color: white;
            width: 320px;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        /* Input com focus (O campo de formulário) */
        input {
            width: 90%;
            padding: 10px;
            font-size: 14px;
            border: 2px solid gray;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        input:focus {
            border-color: #0066cc;
            /* Fica azul ao clicar dentro */
            outline: none;
        }

        /* Botão exclusivo para o :hover */
        .btn-assinar {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .btn-assinar:hover {
            background-color: #0066cc;
            /* Muda de cor ao passar o mouse */
        }

        /*  Botão exclusivo para o :active */
        .btn-cancelar {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #333;
            border: 1px solid #999;
            border-radius: 4px;
            margin-left: 5px;
        }

        .btn-cancelar:active {
            transform: scale(0.9);
            /* Dá um "pulinho" diminuindo o tamanho ao ser clicado */
        }

        /* Lista com 10 linhas e nth-child(odd) */
        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }

        li {
            padding: 8px;
            font-size: 14px;
            border-bottom: 1px solid #eee;
        }

        li:nth-child(odd) {
            background-color: #f4f4f4;
            /* Pinta as linhas ímpares de cinza claro */
        }
    </style>
</head>

<body>

    <div class="painel">
        <h2>Desbloqueie Novidades</h2>

        <input type="text" placeholder="Digite seu melhor e-mail...">

        <div>
            <button class="btn-assinar">Assinar</button>
            <button class="btn-cancelar">Limpar</button>
        </div>

        <h2>Top 10 Jogos da Semana</h2>

        <ul>
            <li>1. The Witcher 3: Wild Hunt</li>
            <li>2. The Sims 4</li>
            <li>3. Far Cry 5</li>
            <li>4. Cyberpunk 2077</li>
            <li>5. Red Dead Redemption 2</li>
            <li>6. Stardew Valley</li>
            <li>7. Skyrim</li>
            <li>8. Fallout 4</li>
            <li>9. Assassin's Creed Odyssey</li>
            <li>10. Horizon Zero Dawn</li>
        </ul>
    </div>

</body>

</html>
