<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Atividade 1 - Positions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding-top: 70px;
        }

        .menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .elemento-relativo {
            position: relative;
            top: 10px;
            background-color: lightcoral;
            padding: 15px;
            margin: 20px;
            width: 350px;
        }

        .pai {
            position: relative;
            background-color: #e0e0e0;
            width: 400px;
            height: 200px;
            margin: 40px 20px;
            padding: 15px;
            border: 2px solid #999;
        }

        .filho-absoluto {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: blue;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="menu">
        Menu
    </div>

    <div class="elemento-relativo">
        Caixa Relative
    </div>

    <div class="pai">
        Conteúdo da caixa pai

        <div class="filho-absoluto">
            Caixa Filho
        </div>
    </div>

</body>

</html>
