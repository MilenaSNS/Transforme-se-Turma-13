<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Atividade 3 - Revisão Geral</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding-top: 70px;
            padding-left: 20px;
        }

        .menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        h1::before {
            content: "⭐ ";
        }

        h1::after {
            content: " ⭐";
        }

        h1 {
            color: blue;
        }

        .destaque {
            color: red;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e0e0e0;
            border: 1px solid #999;
            margin: 20px 0;
        }

        button:hover {
            background-color: green;
            color: white;
        }

        button:active {
            transform: scale(0.9);
            background-color: darkgreen;
        }

        ul {
            list-style: none;
            padding: 0;
            width: 350px;
        }

        li {
            padding: 10px;
            border: 1px solid #ccc;
        }

        li:nth-child(odd) {
            background-color: #f0f0f0;
        }

        li:nth-child(even) {
            background-color: white;
        }
    </style>
</head>

<body>

    <div class="menu">
        Portal Geek - Seu Top 6 Semanal
    </div>

    <h1 class="destaque">Top 6 Jogos da Semana</h1>

    <button>Atualizar Ranking</button>

    <ul>
        <li>1. The Witcher 3: Wild Hunt</li>
        <li>2. The Sims 4</li>
        <li>3. Far Cry 5</li>
        <li>4. Cyberpunk 2077</li>
        <li>5. Red Dead Redemption 2</li>
        <li>6. Stardew Valley</li>
    </ul>

</body>

</html>
