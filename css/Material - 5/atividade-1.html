<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Atividade 1 - Flexbox</title>
    <style>
        .container {
            display: flex;
            background-color: #e0e0e0;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .item {
            background-color: #0066cc;
            color: white;
            padding: 20px;
            margin: 10px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
    </div>

</body>

</html>
