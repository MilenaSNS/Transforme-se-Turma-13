<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Atividade 3 - Align Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            display: flex;
            height: 120px;
            padding: 15px;
            margin-bottom: 30px;
            gap: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .start {
            align-items: flex-start;
            background-color: #e3f2fd;
        }


        .center {
            align-items: center;
            background-color: #e8f5e9;
        }

        .end {
            align-items: flex-end;
            background-color: #fff3e0;
        }


        .stretch {
            align-items: stretch;
            background-color: #f3e5f5;
        }

        .baseline {
            align-items: baseline;
            background-color: #ffebee;
        }

        .item {
            padding: 15px 25px;
            color: white;
            font-weight: bold;
            border-radius: 5px;
        }

        /* Itens com cores diferentes */
        .cor1 {
            background-color: #d32f2f;
        }

        /* Vermelho */
        .cor2 {
            background-color: #1976d2;
        }

        /* Azul */
        .cor3 {
            background-color: #388e3c;
        }

        /* Verde */

        .texto-grande {
            font-size: 30px;
        }

        .texto-pequeno {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h2>1. flex-start (Topo)</h2>
    <div class="container start">
        <div class="item cor1">Item A</div>
        <div class="item cor2">Item B</div>
        <div class="item cor3">Item C</div>
    </div>

    <h2>2. center (Centro)</h2>
    <div class="container center">
        <div class="item cor1">Item A</div>
        <div class="item cor2">Item B</div>
        <div class="item cor3">Item C</div>
    </div>

    <h2>3. flex-end (Base)</h2>
    <div class="container end">
        <div class="item cor1">Item A</div>
        <div class="item cor2">Item B</div>
        <div class="item cor3">Item C</div>
    </div>

    <h2>4. stretch (Esticado)</h2>
    <div class="container stretch">
        <div class="item cor1">Item A</div>
        <div class="item cor2">Item B</div>
        <div class="item cor3">Item C</div>
    </div>

    <h2>5. baseline (Linha do texto)</h2>
    <div class="container baseline">
        <div class="item cor1 texto-grande">Maior</div>
        <div class="item cor2">Normal</div>
        <div class="item cor3 texto-pequeno">Menor</div>
    </div>

</body>

</html>
