<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Tabela de Vendas</title>
</head>

<body>

    <h2>Relatório de Vendas Mensal</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Vendas</th>
                <th>Meta</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Vestido Floral</td>
                <td>15</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Saia Texturizada</td>
                <td>30</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Calça Listrada</td>
                <td>10</td>
                <td>15</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Total de vendas</td>
                <td>55</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
