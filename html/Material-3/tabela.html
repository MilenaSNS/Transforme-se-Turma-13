<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Produtos</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <h2>A Minha Lista de Produtos</h2>
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>R$ 3.500,00</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Mouse sem fio</td>
                <td>R$ 120,00</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Teclado Mecânico</td>
                <td>R$ 350,00</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Monitor 24"</td>
                <td>R$ 800,00</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Cadeira de Escritório</td>
                <td>R$ 650,00</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Headset</td>
                <td>R$ 200,00</td>
                <td>40</td>
            </tr>
            <tr>
                <td>Webcam</td>
                <td>R$ 150,00</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
