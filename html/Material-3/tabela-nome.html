<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Tabela com Rowspan</title>
</head>

<body>

    <h2>Exemplo de Rowspan</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>dados</th>
            </tr>
        </thead>
        <tbody>

            <tr>
                <td rowspan="2">João</td>
                <td>Dado 1 do João</td>
            </tr>

            <tr>
                <td>Dado 2 do João</td>
            </tr>

            <tr>
                <td>Maria</td>
                <td>Dado da Maria</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
