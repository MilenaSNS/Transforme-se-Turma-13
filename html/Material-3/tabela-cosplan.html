<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Tabela com Colspan</title>
</head>

<body>

    <h2>Exemplo de Colspan</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Jan</th>
                <th>Fev</th>
                <th>Mar</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Arroz</td>
                <td>150</td>
                <td>200</td>
                <td>180</td>
            </tr>
            <tr>
                <td colspan="4" align="center">Total: 530</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
