<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Blog Geek - Contato</title>
    <style>
        nav ul {
            list-style-type: none; /* Tirei as bolinhas da lista */
            padding: 0;
        }

        nav li {
            display: inline;   /* Coloquei os itens na mesma linha */
            margin-right: 15px; /* Dei um espacinho entre um link e outro para ficar melhor */
        }
    </style>
</head>

<body>

    <header>
        <h1>Universo Geek</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Fale Comigo</h2>
        <p>Tem alguma sugestão de postagem? Me mande uma mensagem!</p>

        <img src="imgs/imagem4.png" alt="Ícone de mensagem" width="100"><br><br>

        <form action="/enviar" method="POST">
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea><br><br>

            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Universo Geek.</p>
    </footer>

</body>

</html>
