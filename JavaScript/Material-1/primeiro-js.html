<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Código em JavaScript</title>
</head>

<body>
    <h1>Página de testes com JavaScript</h1>
    <p>As mensagens de texto estão rodando escondidas nos bastidores do navegador.</p>

    <!-- A tag <script> serve para inserir códigos JavaScript dentro do HTML -->
    <script>
        // Exemplo de código JavaScript
        // O comando console.log serve para imprimir informações no "Console" do navegador.
        // Estas mensagens NÃO aparecem na tela principal para o usuário comum ver.
        console.log("Olá, mundo!");
        console.log("Estou aprendendo JavaScript");
        console.log("Meu nome é Milena e tenho 22 anos!");
    </script>

</body>

</html>
