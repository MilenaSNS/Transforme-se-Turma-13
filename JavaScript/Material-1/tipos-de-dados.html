<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipos de Dados - Atividade</title>
</head>
<body>

  <h1>📦 Tipos de Dados</h1>

  <script>
    // ==========================================
    // CRIANDO AS VARIÁVEIS
    // Aprendi no material que:
    // string = texto (usar aspas)
    // number = número (sem aspas)
    // boolean = true ou false
    // ==========================================

    // a- Seu nome (string)
    let nome = "Milena";

    // b- Sua idade (number)
    let idade = 22;

    // c- Se está estudando (boolean)
    let estaEstudando = true;

    // ==========================================
    // MOSTRANDO OS VALORES E TIPOS
    // ==========================================

    console.log("=== MEUS DADOS ===");
    console.log("Nome:", nome, "→ tipo:", typeof nome);
    console.log("Idade:", idade, "→ tipo:", typeof idade);
    console.log("Estudando:", estaEstudando , "→ tipo:", typeof estaEstudando);
  </script>

</body>
</html>
