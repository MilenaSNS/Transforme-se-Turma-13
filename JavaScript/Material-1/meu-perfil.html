<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil em JS</title>
</head>
<body>

  <h1>👩‍💻 Meu Perfil</h1>
  <p>Abra o console (no F12) para ver os dados gerados pelo JavaScript.</p>

  <script>
    // ==========================================
    // CRIANDO AS VARIÁVEIS DO PERFIL
    // ==========================================

    // 1- Seu nome (string)
    let nome = "Milena";

    // 2- Sua idade (number)
    let idade = 22;

    // 3- Sua altura (number)
    let altura = 1.58;

    // 4- Se é estudante (boolean)
    let estudante = true;

    // 5- Seu email (string)
    let email = "milena.sns.1@gmail.com";

    // 6- Um valor null (nulo)
    let telefoneFixo = null; 

    // ==========================================
    // MOSTRANDO OS VALORES E TIPOS NO CONSOLE
    // ==========================================

    console.log("=== DADOS DO MEU PERFIL ===");
    console.log("Nome:", nome, "→ tipo:", typeof nome);
    console.log("Idade:", idade, "→ tipo:", typeof idade);
    console.log("Altura:", altura, "→ tipo:", typeof altura);
    console.log("Estudante:", estudante, "→ tipo:", typeof estudante);
    console.log("Email:", email, "→ tipo:", typeof email);
    console.log("Telefone Fixo:", telefoneFixo, "→ tipo:", typeof telefoneFixo);
  </script>

</body>
</html>
